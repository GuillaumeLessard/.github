name: Bug report
description: Something does not work as documented.
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: |
        Thanks for reporting. For a security problem, do not open an issue: follow the [security policy](https://github.com/GuillaumeLessard/.github/blob/main/SECURITY.md).
  - type: textarea
    id: what-happened
    attributes:
      label: What happened
      description: What you did, what you expected, and what happened instead.
    validations:
      required: true
  - type: textarea
    id: example
    attributes:
      label: Smallest example that shows it
      description: Code or commands we can run as they are.
      render: text
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Version
      description: Package, plugin or app version, or the commit you used.
      placeholder: "qector-decoder-v3 1.0.1"
    validations:
      required: true
  - type: input
    id: platform
    attributes:
      label: Platform
      description: Operating system, Python version, CPU or GPU.
      placeholder: "Windows 11, Python 3.12, CPU"
    validations:
      required: true
  - type: textarea
    id: output
    attributes:
      label: Error output
      description: The full traceback or log, if there is one.
      render: text
